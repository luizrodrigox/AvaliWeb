<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R04 - Correto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 700px);
            margin: 0 auto;
        }

        .card {
            padding: 24px;
            border: 1px solid #999;
            border-radius: 8px;
        }

        h1 {
            font-size: 28px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            max-width: 100%;
            padding: 12px 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<main>
    <section class="card">
        <h1>Redimensionamento adequado</h1>

        <p>
            Este conteúdo possui dimensões flexíveis e permite
            que o texto ocupe o espaço necessário quando seu
            tamanho é aumentado.
        </p>

        <p>
            O componente também pode crescer verticalmente
            sem cortar ou sobrepor o conteúdo.
        </p>

        <button class="button">
            Continuar
        </button>
    </section>
</main>

</body>
</html>
