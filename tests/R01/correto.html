<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>R01 - Correto</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        main {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );
            gap: 20px;
        }

        .card {
            min-width: 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
        }

    </style>
</head>

<body>

    <main>

        <h1>Exemplo correto — R01</h1>

        <p>
            Esta página utiliza dimensões adaptáveis
            para permanecer dentro da largura disponível.
        </p>

        <div class="cards">

            <section class="card">

                <h2>Card 1</h2>

                <p>
                    Conteúdo adaptável à largura disponível.
                </p>

            </section>

            <section class="card">

                <h2>Card 2</h2>

                <p>
                    Conteúdo adaptável à largura disponível.
                </p>

            </section>

            <section class="card">

                <h2>Card 3</h2>

                <p>
                    Conteúdo adaptável à largura disponível.
                </p>

            </section>

        </div>

    </main>

</body>

</html>
