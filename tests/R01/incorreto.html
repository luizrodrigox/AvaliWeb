<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>R01 - Incorreto</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        main {
            padding: 20px;
        }

        .content {
            width: 2000px;
        }

        .large-element {
            width: 2000px;
            height: 100px;
            background: #ddd;
        }

    </style>
</head>

<body>

    <main>

        <h1>Exemplo incorreto — R01</h1>

        <div class="content">

            <p>
                Este conteúdo possui largura fixa superior
                à largura disponível da viewport.
            </p>

            <div class="large-element">
                Elemento que ultrapassa a viewport.
            </div>

        </div>

    </main>

</body>

</html>
