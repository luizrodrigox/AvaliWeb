<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teste R02 - Correto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        button {
            padding: 12px 20px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Teste correto do R02</h1>

        <section class="card">
            <h2>Conteúdo dentro da viewport</h2>

            <p>
                Todos os elementos desta página possuem
                dimensões compatíveis com a área disponível.
            </p>

            <button>
                Ação
            </button>
        </section>

        <section class="card">

            <p>
                O conteúdo utiliza largura responsiva
                e não ultrapassa os limites da viewport.
            </p>

        </section>

    </main>

</body>
</html>
