<head>

    <title>U06 - Incorreto</title>

        }

    </style>
</head>

<body>

    <main>

        <button id="botao-1">

        <a id="link-1" href="#inicio">

        </a>

        <a id="link-2" href="#produtos">
            Produtos
        </a>

    </main>

</body>

</html>
