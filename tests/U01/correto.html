<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>U01 - Correto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .target {
            min-width: 24px;
            min-height: 24px;
            padding: 10px 16px;
            margin: 10px;
        }

        input {
            width: 200px;
            height: 40px;
            margin: 10px;
        }

        select {
            width: 200px;
            height: 40px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Teste U01 - Correto</h1>

    <button class="target">
        Botão 1
    </button>

    <button class="target">
        Botão 2
    </button>

    <input
        type="text"
        aria-label="Campo de texto"
        placeholder="Campo de texto"
    >

    <select
        aria-label="Seleção"
    >
        <option>Opção 1</option>
        <option>Opção 2</option>
    </select>

</body>

</html>
