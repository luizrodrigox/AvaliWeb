<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>D05 - Incorreto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .area {
            position: relative;
            width: 500px;
            height: 300px;
            border: 1px solid #ccc;
        }

        .botao {
            position: absolute;
            width: 160px;
            height: 60px;
        }

        #botao-1 {
            left: 80px;
            top: 80px;
        }

        #botao-2 {
            left: 140px;
            top: 110px;
        }

        #card-1 {
            position: absolute;
            left: 260px;
            top: 80px;
            width: 180px;
            height: 100px;
            background: #eee;
        }

        #card-2 {
            position: absolute;
            left: 300px;
            top: 120px;
            width: 180px;
            height: 100px;
            background: #ddd;
        }
    </style>
</head>

<body>

    <main>

        <h1>Exemplo incorreto — D05</h1>

        <div class="area">

            <button
                id="botao-1"
                class="botao">
                Botão 1
            </button>

            <button
                id="botao-2"
                class="botao">
                Botão 2
            </button>

            <div id="card-1">
                Card 1
            </div>

            <div id="card-2">
                Card 2
            </div>

        </div>

    </main>

</body>

</html>
