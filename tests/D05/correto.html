<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>D05 - Correto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .container {
            display: flex;
            gap: 24px;
        }

        .card {
            width: 220px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 10px 18px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <main>

        <h1>Exemplo correto — D05</h1>

        <div class="container">

            <section class="card">

                <h2>Produto 1</h2>

                <p>
                    Descrição do primeiro produto.
                </p>

                <button>
                    Comprar
                </button>

            </section>

            <section class="card">

                <h2>Produto 2</h2>

                <p>
                    Descrição do segundo produto.
                </p>

                <button>
                    Comprar
                </button>

            </section>

        </div>

    </main>

</body>

</html>
