<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste A03 - Correto</title>
</head>

<body>

    <h1>Teste A03</h1>

    <form>

        <label for="nome">
            Nome
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
        >

        <input
            type="email"
            name="email"
            aria-label="E-mail"
        >

        <span id="cidade-label">
            Cidade
        </span>

        <select
            id="cidade"
            aria-labelledby="cidade-label"
        >
            <option>Apodi</option>
            <option>Natal</option>
        </select>

        <label>
            Telefone
            <input
                type="tel"
                name="telefone"
            >
        </label>

    </form>

</body>

</html>
