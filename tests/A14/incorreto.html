<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>A14 - Incorreto</title>

    <style>

        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 300px;
            height: 45px;
            overflow: hidden;
        }

        .texto {
            width: 250px;
            height: 25px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <h1>A14</h1>

    <div class="container">

        <p class="texto">
            Este texto possui uma quantidade grande
            de informações que não poderá ser exibida
            corretamente quando o tamanho da fonte for
            aumentado.
        </p>

    </div>

</body>

</html>
