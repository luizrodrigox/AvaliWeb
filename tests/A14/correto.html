<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>A14 - Correto</title>

    <style>

        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 700px;
            margin: 0 auto;
        }

        p {
            line-height: 1.6;
        }

        .card {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 16px;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <main>

        <h1>Aumento e redução de fontes</h1>

        <div class="card">

            <p>
                Este conteúdo possui espaço suficiente
                para se adaptar às alterações no tamanho
                da fonte.
            </p>

            <p>
                O texto pode ocupar várias linhas sem
                perder informações ou ultrapassar os
                limites do elemento.
            </p>

            <button>
                Continuar
            </button>

        </div>

    </main>

</body>

</html>
