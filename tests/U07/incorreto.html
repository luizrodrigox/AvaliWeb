<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>U07 - Incorreto</title>

    <style>

        .btn-padrao {
            width: 120px;
            height: 40px;

            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: 700;

            color: white;
            background-color: rgb(0, 123, 255);

            border: 1px solid rgb(0, 123, 255);
            border-radius: 6px;
        }

        .btn-diferente {
            width: 180px;
            height: 55px;

            font-family: Georgia, serif;
            font-size: 20px;
            font-weight: 400;

            color: black;
            background-color: yellow;

            border: 3px solid red;
            border-radius: 0;
        }

        .btn-diferente-2 {
            width: 100px;
            height: 35px;

            font-family: Verdana, sans-serif;
            font-size: 12px;
            font-weight: 400;

            color: white;
            background-color: green;

            border: 0 solid green;
            border-radius: 20px;
        }

    </style>
</head>

<body>

    <h1>Teste U07</h1>

    <button class="btn-padrao">
        Salvar
    </button>

    <button class="btn-padrao">
        Editar
    </button>

    <button class="btn-diferente">
        Excluir
    </button>

    <button class="btn-diferente-2">
        Cancelar
    </button>

</body>
</html>
