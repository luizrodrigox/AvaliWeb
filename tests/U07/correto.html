<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>U07 - Correto</title>

    <style>
        .btn {
            width: 120px;
            height: 40px;

            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: 700;

            color: white;
            background-color: rgb(0, 123, 255);

            border: 1px solid rgb(0, 123, 255);
            border-radius: 6px;

            cursor: pointer;
        }

        .container {
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>

    <h1>Teste U07</h1>

    <div class="container">

        <button class="btn">
            Salvar
        </button>

        <button class="btn">
            Editar
        </button>

        <button class="btn">
            Excluir
        </button>

    </div>

</body>
</html>
