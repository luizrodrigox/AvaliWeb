<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>D04 - Correto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
        }

        section {
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #ccc;
        }

        h1 {
            margin-bottom: 24px;
        }

        p {
            margin-bottom: 16px;
        }

        .botoes {
            display: flex;
            gap: 16px;
            margin-top: 24px;
        }

        button {
            padding: 12px 20px;
        }

        .cards {
            display: flex;
            gap: 24px;
            margin-top: 24px;
        }

        .card {
            padding: 20px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

<main>

    <h1>Espaçamento adequado</h1>

    <section>
        <h2>Seção principal</h2>

        <p>
            Este conteúdo possui espaçamentos adequados
            entre os elementos.
        </p>

        <div class="botoes">
            <button>Salvar</button>
            <button>Cancelar</button>
        </div>
    </section>

    <section>
        <h2>Informações adicionais</h2>

        <p>
            Os elementos desta seção possuem margens,
            paddings e distâncias suficientes.
        </p>

        <div class="cards">
            <div class="card">
                <h3>Card 1</h3>
                <p>Conteúdo do primeiro card.</p>
            </div>

            <div class="card">
                <h3>Card 2</h3>
                <p>Conteúdo do segundo card.</p>
            </div>
        </div>
    </section>

</main>

</body>
</html>
