<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>D04 - Incorreto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
        }

        section {
            padding: 2px;
            margin-bottom: 3px;
            border: 1px solid #ccc;
        }

        h1 {
            margin-bottom: 2px;
        }

        h2 {
            margin: 2px;
        }

        p {
            margin: 2px;
        }

        .grupo {
            display: flex;
            gap: 2px;
            margin-top: 2px;
        }

        button {
            padding: 4px;
        }

        .cards {
            display: flex;
            gap: 1px;
            margin-top: 2px;
        }

        .card {
            padding: 2px;
            border: 1px solid #ccc;
        }

        .sobreposto {
            position: relative;
            margin-top: -15px;
        }
    </style>
</head>

<body>

<main>

    <h1>Espaçamento inadequado</h1>

    <section>

        <h2>Seção</h2>

        <p>
            Elementos com espaçamento excessivamente pequeno.
        </p>

        <div class="grupo">
            <button id="botao-1">Salvar</button>
            <button id="botao-2">Editar</button>
            <button id="botao-3">Excluir</button>
        </div>

    </section>

    <section class="sobreposto">

        <h2>Outra seção</h2>

        <p>
            Esta seção apresenta proximidade excessiva
            em relação ao conteúdo anterior.
        </p>

        <div class="cards">

            <div class="card">
                <h3>Card 1</h3>
                <p>Conteúdo.</p>
            </div>

            <div class="card">
                <h3>Card 2</h3>
                <p>Conteúdo.</p>
            </div>

        </div>

    </section>

</main>

</body>
</html>
