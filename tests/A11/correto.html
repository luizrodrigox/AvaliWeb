<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>A11 - Correto</title>

    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }

        button,
        a,
        input {
            margin: 10px;
            padding: 10px;
        }

        button:focus,
        a:focus,
        input:focus {
            outline: 3px solid #005fcc;
            outline-offset: 2px;
        }
    </style>
</head>

<body>

    <h1>Foco visível</h1>

    <button type="button">
        Enviar
    </button>

    <a href="https://example.com">
        Acessar página
    </a>

    <input
        type="text"
        aria-label="Nome">

</body>
</html>
